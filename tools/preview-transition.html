<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open Mappr transition &mdash; tuning</title>
<style>
:root{
  --field:#121212;--panel:#1e1e1e;--line:#343434;
  --ink:#e3e3e3;--ash:#b9bcc0;--muted:#8d949b;--yellow:#ffd43b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--field);color:var(--ink);
     font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.bar{height:56px;background:var(--panel);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:14px;padding:0 32px;flex-shrink:0;position:relative;z-index:2}
.bar .n{font-weight:800;font-size:20px;letter-spacing:-.6px}
.bar .t{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;color:var(--muted);letter-spacing:1.2px}
main{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;z-index:2}
.stage{text-align:center;max-width:580px}
h1{font-weight:800;font-size:48px;letter-spacing:-2px;margin:0 0 14px}
p{color:var(--ash);font-size:15px;line-height:1.6;margin:0 0 30px}
.go{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:200px;height:48px;color:var(--yellow);border:0;background:none;padding:0;cursor:pointer}
.go .ed{position:absolute;inset:0;display:block;pointer-events:none;color:inherit}
.go .ed svg{display:block;width:100%;height:100%}
.go .t{position:relative;font-weight:600;font-size:15px;color:var(--field)}
.go:active{transform:translateY(2px)}
.panel{flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);
       padding:16px 32px 20px;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap;position:relative;z-index:200}
.ctl{display:flex;flex-direction:column;gap:7px;min-width:178px}
.ctl label{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:1.3px;color:var(--muted)}
.ctl .row{display:flex;align-items:center;gap:12px}
.ctl input[type=range]{flex:1 1 auto;accent-color:var(--yellow)}
.ctl .v{font-family:ui-monospace,monospace;font-size:13px;color:var(--yellow);min-width:56px;text-align:right}
.seg{display:flex;border:1px solid var(--line)}
.seg button{flex:1 1 0;background:none;border:0;color:var(--muted);cursor:pointer;
            font-family:ui-monospace,monospace;font-size:11px;letter-spacing:1px;padding:9px 12px}
.seg button[aria-pressed=true]{background:var(--yellow);color:var(--field);font-weight:600}
.out{margin-left:auto;font-family:ui-monospace,monospace;font-size:11px;line-height:1.7;color:var(--muted);text-align:right}
.out b{color:var(--ink);font-weight:400}
.glaze-over{
  position:fixed;inset:0;z-index:100;display:grid;
  grid-auto-rows:var(--m);pointer-events:none;
  justify-content:center;align-content:center;
}
.glaze-over .gt{
  display:block;width:var(--m);height:var(--m);opacity:0;
  animation:gtin .001s steps(1,end) forwards;
}
.glaze-over .gt svg{display:block;width:100%;height:100%}
@keyframes gtin{to{opacity:1}}


</style>
</head>
<body>

<div class="bar"><span class="n">ARGH!</span><span class="t">TRANSITION &mdash; TUNING HARNESS, NOT A PAGE</span></div>

<main>

  </div>
</main>

<div class="panel">
  <div class="ctl" style="min-width:270px">
    <label>VARIATION</label>
    <div class="seg">
      <button id="vA" aria-pressed="true">A &middot; PLATE</button>
      <button id="vB" aria-pressed="false">B &middot; BUNGI</button>

  </div>
  <div class="ctl">

    <div class="row"><input id="step" type="range" min="8" max="120" step="2" value="70"><span class="v" id="stepv">70ms</span></div>
  </div>
  <div class="ctl">
    <label for="hold">HOLD BEFORE HAND-OVER</label>
    <div class="row"><input id="hold" type="range" min="0" max="900" step="10" value="300"><span class="v" id="holdv">300ms</span></div>
  </div>
  <div class="ctl">
    <label for="mod">TILE MODULE</label>
    <div class="row"><input id="mod" type="range" min="40" max="160" step="2" value="80"><span class="v" id="modv">80px</span></div>
  </div>
  <div class="ctl" id="denwrap">
    <label for="den">B &middot; HOW MANY TILES ARE YELLOW</label>
    <div class="row"><input id="den" type="range" min="6" max="40" step="1" value="17"><span class="v" id="denv">17%</span></div>
  </div>
  <div class="ctl" id="bisqwrap">
    <label for="bisq">C &middot; UNFIRED TILE STRENGTH</label>
    <div class="row"><input id="bisq" type="range" min="4" max="40" step="1" value="14"><span class="v" id="bisqv">14%</span></div>
  </div>
  <div class="out">
    total <b id="total">&mdash;</b><br>
    tiles <b id="count">&mdash;</b>
  </div>
</div>

      e.setAttribute('stroke-opacity',o); e.setAttribute('stroke-linecap','round');
      e.setAttribute('stroke-linejoin','round'); s.appendChild(e);
    }

        g=0; do{m=(Math.random()*names.length)|0;g++}while(badM[m]&&g<30);
        grid[r][c]={a:a,m:m};

        var cell=document.createElement('span'); cell.className='gt';
        cell.style.animationDelay=(Math.round((r+c)/2)*STEP)+'ms';
        var shape=D.tiles[(r*3+c*5)%D.tiles.length], mo=D.motifs[names[m]];
        if(MODE==='A' || a===2){ cell.appendChild(tile(shape,mo,accent)); laid++; }
        else if(MODE==='C'){ cell.appendChild(bisque(shape,mo,BQ,accent)); }
        el.appendChild(cell);
      }}
    document.body.appendChild(el);

    var wait=Math.round((rows+cols)/2)*STEP+HOLD;
    // no dim: the page stays visible through the tiles, so this is a veil
    // over the page rather than a cover over it
    total.textContent=wait+'ms';
    count.textContent=laid+' glazed of '+(rows*cols)+' ('+cols+'x'+rows+')';

    setTimeout(function(){
      el.style.transition='opacity .18s steps(3,end)'; el.style.opacity='0';
      setTimeout(function(){el.remove()},200);
    }, wait);
  });
})();
</script>
</body>
</html>
